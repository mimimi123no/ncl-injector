name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Chon Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Cai ldid
        run: brew install ldid
      - name: Build IPA
        run: |
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZipDrop-ipa
          path: build/ZipDrop.ipa
